name: GitOps Image Promotion

on:
  workflow_call:
    inputs:
      deployment-environment:
        description: Protected GitHub Environment where promotion approval is enforced.
        required: true
        type: string
      gitops-repository:
        required: true
        type: string
      gitops-ref:
        required: false
        default: main
        type: string
      kustomization-path:
        required: true
        type: string
      image-name:
        required: true
        type: string
      image-ref:
        description: Immutable image digest reference, ghcr.io/name@sha256:...
        required: true
        type: string
      promotion-branch-prefix:
        required: false
        default: promotion
        type: string
    secrets:
      GITOPS_REPOSITORY_TOKEN:
        required: true

jobs:
  promote:
    environment: ${{ inputs.deployment-environment }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout caller project for copied standards check
        id: caller-checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          path: caller-project
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.agent-standards.yml
            /.agents/core
            /.agents/skills
            /.claude/skills

      - name: Check for copied agent standards
        continue-on-error: true
        shell: bash
        env:
          COPIED_STANDARDS_ROOT: caller-project
          CALLER_CHECKOUT_OUTCOME: ${{ steps.caller-checkout.outcome }}
        run: |
          root="${COPIED_STANDARDS_ROOT:-.}"
          outcome="${CALLER_CHECKOUT_OUTCOME-success}"
          clean_url="https://github.com/ute-workspace/agent-standards/blob/main/scripts/clean-project.py"
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          escape() { local s="${1//%/%25}"; s="${s//$'\r'/%0D}"; printf '%s' "${s//$'\n'/%0A}"; }
          # Summary text: ASCII other than [A-Za-z0-9._/-] becomes an HTML entity, so names cannot form Markdown or HTML.
          md() {
            local LC_ALL=C s="$1" out="" c n i
            for ((i = 0; i < ${#s}; i++)); do
              c="${s:i:1}"
              case "$c" in
                [A-Za-z0-9._/-]) out+="$c" ;;
                *) printf -v n '%d' "'$c"; if ((n < 0 || n > 127)); then out+="$c"; else out+="&#$n;"; fi ;;
              esac
            done
            printf '%s' "$out"
          }
          not_checked() {
            echo "::warning title=Copied agent standards::Project checkout '$(escape "$root")' $(escape "$1"); copied agent standards were not checked."
            printf '## Copied agent standards\n\nNot checked: project checkout <code>%s</code> %s.\n' "$(md "$root")" "$(md "$1")" >> "$summary"
            exit 0
          }
          [ "$outcome" = success ] || not_checked "failed (checkout outcome: ${outcome:-unknown})"
          [ -d "$root" ] && [ ! -L "$root" ] || not_checked "not found"
          found=()
          for parent in .agents .claude; do
            # A symlinked parent is reported itself; its target is not listed.
            if [ -L "$root/$parent" ]; then found+=("$parent"); fi
          done
          for path in .agents/core .agent-standards.yml .claude/skills .agents/skills; do
            case " ${found[*]} " in *" ${path%%/*} "*) continue ;; esac
            if [ -L "$root/$path" ] || { [ -e "$root/$path" ] && [ ! -d "$root/$path" ]; }; then
              found+=("$path")
            elif [ -d "$root/$path" ]; then
              case "$path" in
                */skills)
                  while IFS= read -r -d '' entry; do
                    found+=("$path/${entry##*/}")
                  done < <(find "$root/$path" -mindepth 1 -maxdepth 1 -print0 | sort -z) ;;
                *) found+=("$path") ;;
              esac
            fi
          done
          if [ "${#found[@]}" -eq 0 ]; then
            echo "No copied agent standards found."
            printf '## Copied agent standards\n\nNone found.\n' >> "$summary"
            exit 0
          fi
          {
            printf '## Copied agent standards\n\n'
            printf 'Warning only; the build is not failed. Remove these paths with [scripts/clean-project.py](%s):\n\n' "$clean_url"
          } >> "$summary"
          for path in "${found[@]}"; do
            echo "::warning title=Copied agent standards::$(escape "$path") is a copy of agent standards; remove it with $clean_url"
            printf -- '- <code>%s</code>\n' "$(md "$path")" >> "$summary"
          done

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gitops-repository }}
          ref: ${{ inputs.gitops-ref }}
          token: ${{ secrets.GITOPS_REPOSITORY_TOKEN }}
          path: gitops

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update image and validate rendered manifests
        id: promotion
        shell: bash
        run: |
          set -euo pipefail
          cd gitops/${{ inputs.kustomization-path }}
          branch="${{ inputs.promotion-branch-prefix }}/${{ github.run_id }}"
          git checkout -b "$branch"
          kustomize edit set image "${{ inputs.image-name }}=${{ inputs.image-ref }}"
          kustomize build . >/dev/null
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Commit and open GitOps pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITOPS_REPOSITORY_TOKEN }}
        run: |
          set -euo pipefail
          cd gitops
          git config user.name "gitops-bot"
          git config user.email "gitops-bot@users.noreply.github.com"
          git add "${{ inputs.kustomization-path }}/kustomization.yaml"
          git commit -m "chore(gitops): promote ${{ inputs.image-name }}" \
            -m "Image: ${{ inputs.image-ref }}"
          git push origin "${{ steps.promotion.outputs.branch }}"
          gh pr create \
            --repo "${{ inputs.gitops-repository }}" \
            --base "${{ inputs.gitops-ref }}" \
            --head "${{ steps.promotion.outputs.branch }}" \
            --title "chore(gitops): promote ${{ inputs.image-name }}" \
            --body "Promotes immutable image reference: \`${{ inputs.image-ref }}\`."
