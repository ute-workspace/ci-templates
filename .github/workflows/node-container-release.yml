name: Node Container Release

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        default: "20"
        type: string
      image-name:
        description: ghcr.io namespace/name, without tag
        required: true
        type: string
      working-directory:
        required: false
        default: src
        type: string
      dockerfile:
        required: false
        default: Dockerfile
        type: string
    outputs:
      image-ref:
        description: Immutable image reference, including digest.
        value: ${{ jobs.release.outputs.image-ref }}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image-ref: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install and verify
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: |
          set -eu
          npm ci
          npm run lint
          npm start > /tmp/node-release.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; cat /tmp/node-release.log || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/readyz >/dev/null
          npm test

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ inputs.image-name }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: HIGH,CRITICAL
          exit-code: "1"

      # steps.build.outputs.digest (above) is NOT the digest of what
      # actually lands in the registry -- see container-release.yml's
      # own identical fix/comment (found for real 2026-08-15, first
      # consumer to actually resolve a recorded image-ref by digest: it
      # pointed at the image's config blob, not its manifest, and no
      # puller could ever resolve it). Capture the real, actually-pushed
      # digest from `docker push`'s own output instead.
      - name: Push image
        id: push
        run: |
          docker push --all-tags "ghcr.io/${{ inputs.image-name }}" | tee /tmp/docker-push-output.txt
          digest="$(grep -oE 'sha256:[0-9a-f]{64}' /tmp/docker-push-output.txt | head -1)"
          if [ -z "$digest" ]; then
            echo "::error::could not parse a digest from docker push's own output" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - id: image
        name: Record immutable image reference
        shell: bash
        run: |
          echo "ref=ghcr.io/${{ inputs.image-name }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

      # Best-effort: build provenance attestations require a feature this
      # org's current billing plan doesn't have for private repos --
      # confirmed for real via container-release.yml's own first release
      # (jenkins, formerly ute-jenkins). Hasn't been observed here yet
      # only because ute-demo-nodejs's own image publishes under a
      # different GitHub org namespace; fixing proactively so any future
      # ute-workspace-namespaced consumer of this workflow doesn't hit
      # the same release-blocking failure. The image push above already
      # succeeded by this point either way.
      - uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-name: ghcr.io/${{ inputs.image-name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
