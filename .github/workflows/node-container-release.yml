name: Node Container Release

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        default: "20"
        type: string
      image-name:
        description: ghcr.io namespace/name, without tag
        required: true
        type: string
      working-directory:
        required: false
        default: src
        type: string
      dockerfile:
        required: false
        default: Dockerfile
        type: string
    outputs:
      image-ref:
        description: Immutable image reference, including digest.
        value: ${{ jobs.release.outputs.image-ref }}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image-ref: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for copied agent standards
        shell: bash
        run: |
          root="${COPIED_STANDARDS_ROOT:-.}"
          outcome="${CALLER_CHECKOUT_OUTCOME-success}"
          clean_url="https://github.com/ute-workspace/agent-standards/blob/main/scripts/clean-project.py"
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          escape() { local s="${1//%/%25}"; s="${s//$'\r'/%0D}"; printf '%s' "${s//$'\n'/%0A}"; }
          # Summary text: ASCII other than [A-Za-z0-9._/-] becomes an HTML entity, so names cannot form Markdown or HTML.
          md() {
            local LC_ALL=C s="$1" out="" c n i
            for ((i = 0; i < ${#s}; i++)); do
              c="${s:i:1}"
              case "$c" in
                [A-Za-z0-9._/-]) out+="$c" ;;
                *) printf -v n '%d' "'$c"; if ((n < 0 || n > 127)); then out+="$c"; else out+="&#$n;"; fi ;;
              esac
            done
            printf '%s' "$out"
          }
          not_checked() {
            echo "::warning title=Copied agent standards::Project checkout '$(escape "$root")' $(escape "$1"); copied agent standards were not checked."
            printf '## Copied agent standards\n\nNot checked: project checkout <code>%s</code> %s.\n' "$(md "$root")" "$(md "$1")" >> "$summary"
            exit 0
          }
          [ "$outcome" = success ] || not_checked "failed (checkout outcome: ${outcome:-unknown})"
          [ -d "$root" ] && [ ! -L "$root" ] || not_checked "not found"
          found=()
          linked=" "
          for parent in .agents .claude; do
            # A symlinked parent is reported itself; its target is not listed.
            if [ -L "$root/$parent" ]; then found+=("$parent"); linked+="$parent "; fi
          done
          for path in .agents/core .agent-standards.yml .claude/skills .agents/skills; do
            # Only fixed parent names are matched, never names found in the project.
            case "$linked" in *" ${path%%/*} "*) continue ;; esac
            if [ -L "$root/$path" ] || { [ -e "$root/$path" ] && [ ! -d "$root/$path" ]; }; then
              found+=("$path")
            elif [ -d "$root/$path" ]; then
              case "$path" in
                */skills)
                  while IFS= read -r -d '' entry; do
                    found+=("$path/${entry##*/}")
                  done < <(find "$root/$path" -mindepth 1 -maxdepth 1 -print0 | sort -z) ;;
                *) found+=("$path") ;;
              esac
            fi
          done
          if [ "${#found[@]}" -eq 0 ]; then
            echo "No copied agent standards found."
            printf '## Copied agent standards\n\nNone found.\n' >> "$summary"
            exit 0
          fi
          {
            printf '## Copied agent standards\n\n'
            printf 'The build fails until these paths are removed with [scripts/clean-project.py](%s):\n\n' "$clean_url"
          } >> "$summary"
          for path in "${found[@]}"; do
            echo "::error title=Copied agent standards::$(escape "$path") is a copy of agent standards; remove it with $clean_url"
            printf -- '- <code>%s</code>\n' "$(md "$path")" >> "$summary"
          done
          exit 1

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install and verify
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: |
          set -eu
          npm ci
          npm run lint
          npm start > /tmp/node-release.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; cat /tmp/node-release.log || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/readyz >/dev/null
          npm test

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ inputs.image-name }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: HIGH,CRITICAL
          exit-code: "1"

      # steps.build.outputs.digest (above) is not the digest of what
      # actually lands in the registry: the build step above uses
      # `push: false, load: true`, and this step re-uploads the image
      # via a plain `docker push`, which can produce a different
      # manifest digest than buildx's build-time digest (see
      # container-release.yml). Capture the actually-pushed digest from
      # `docker push`'s own output instead.
      - name: Push image
        id: push
        run: |
          docker push --all-tags "ghcr.io/${{ inputs.image-name }}" | tee /tmp/docker-push-output.txt
          digest="$(grep -oE 'sha256:[0-9a-f]{64}' /tmp/docker-push-output.txt | head -1)"
          if [ -z "$digest" ]; then
            echo "::error::could not parse a digest from docker push's own output" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - id: image
        name: Record immutable image reference
        shell: bash
        run: |
          echo "ref=ghcr.io/${{ inputs.image-name }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

      # Best-effort: some GitHub billing plans do not support build
      # provenance attestations for private repositories, in which case
      # this step fails after the image push above has already
      # succeeded; continue-on-error keeps that failure from failing the
      # whole release.
      - uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-name: ghcr.io/${{ inputs.image-name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
