name: Protected Ansible Deploy

on:
  workflow_call:
    inputs:
      deployment-environment:
        required: true
        type: string
      runner-label:
        description: Dedicated client/internal deployment runner label; never an application host.
        required: true
        type: string
      ansible-repository:
        required: false
        default: ute-workspace/ansible
        type: string
      ansible-ref:
        required: false
        default: v1
        type: string
      playbook:
        required: true
        type: string
      inventory-path:
        description: Path available on the self-hosted runner, outside this repository.
        required: true
        type: string
    secrets:
      ANSIBLE_PRIVATE_KEY:
        required: true
      GHCR_USERNAME:
        required: false
      GHCR_TOKEN:
        required: false
      RUNTIME_ENV_CONTENT:
        required: false
      ANSIBLE_REPOSITORY_TOKEN:
        required: true

jobs:
  deploy:
    environment: ${{ inputs.deployment-environment }}
    runs-on: ${{ inputs.runner-label }}
    permissions:
      contents: read
    steps:
      - name: Checkout caller project for copied standards check
        id: caller-checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          path: caller-project
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.agent-standards.yml
            /.agents
            !/.agents/*
            /.agents/core
            /.agents/skills
            /.claude
            !/.claude/*
            /.claude/skills

      - name: Check for copied agent standards
        continue-on-error: true
        shell: bash
        env:
          COPIED_STANDARDS_ROOT: caller-project
          CALLER_CHECKOUT_OUTCOME: ${{ steps.caller-checkout.outcome }}
        run: |
          root="${COPIED_STANDARDS_ROOT:-.}"
          outcome="${CALLER_CHECKOUT_OUTCOME-success}"
          clean_url="https://github.com/ute-workspace/agent-standards/blob/main/scripts/clean-project.py"
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          escape() { local s="${1//%/%25}"; s="${s//$'\r'/%0D}"; printf '%s' "${s//$'\n'/%0A}"; }
          # Summary text: ASCII other than [A-Za-z0-9._/-] becomes an HTML entity, so names cannot form Markdown or HTML.
          md() {
            local LC_ALL=C s="$1" out="" c n i
            for ((i = 0; i < ${#s}; i++)); do
              c="${s:i:1}"
              case "$c" in
                [A-Za-z0-9._/-]) out+="$c" ;;
                *) printf -v n '%d' "'$c"; if ((n < 0 || n > 127)); then out+="$c"; else out+="&#$n;"; fi ;;
              esac
            done
            printf '%s' "$out"
          }
          not_checked() {
            echo "::warning title=Copied agent standards::Project checkout '$(escape "$root")' $(escape "$1"); copied agent standards were not checked."
            printf '## Copied agent standards\n\nNot checked: project checkout <code>%s</code> %s.\n' "$(md "$root")" "$(md "$1")" >> "$summary"
            exit 0
          }
          [ "$outcome" = success ] || not_checked "failed (checkout outcome: ${outcome:-unknown})"
          [ -d "$root" ] && [ ! -L "$root" ] || not_checked "not found"
          found=()
          linked=" "
          for parent in .agents .claude; do
            # A symlinked parent is reported itself; its target is not listed.
            if [ -L "$root/$parent" ]; then found+=("$parent"); linked+="$parent "; fi
          done
          for path in .agents/core .agent-standards.yml .claude/skills .agents/skills; do
            # Only fixed parent names are matched, never names found in the project.
            case "$linked" in *" ${path%%/*} "*) continue ;; esac
            if [ -L "$root/$path" ] || { [ -e "$root/$path" ] && [ ! -d "$root/$path" ]; }; then
              found+=("$path")
            elif [ -d "$root/$path" ]; then
              case "$path" in
                */skills)
                  while IFS= read -r -d '' entry; do
                    found+=("$path/${entry##*/}")
                  done < <(find "$root/$path" -mindepth 1 -maxdepth 1 -print0 | sort -z) ;;
                *) found+=("$path") ;;
              esac
            fi
          done
          if [ "${#found[@]}" -eq 0 ]; then
            echo "No copied agent standards found."
            printf '## Copied agent standards\n\nNone found.\n' >> "$summary"
            exit 0
          fi
          {
            printf '## Copied agent standards\n\n'
            printf 'Warning only; the build is not failed. Remove these paths with [scripts/clean-project.py](%s):\n\n' "$clean_url"
          } >> "$summary"
          for path in "${found[@]}"; do
            echo "::warning title=Copied agent standards::$(escape "$path") is a copy of agent standards; remove it with $clean_url"
            printf -- '- <code>%s</code>\n' "$(md "$path")" >> "$summary"
          done

      - name: Install protected SSH key
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.ANSIBLE_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Checkout approved Ansible release
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.ansible-repository }}
          ref: ${{ inputs.ansible-ref }}
          path: ansible
          token: ${{ secrets.ANSIBLE_REPOSITORY_TOKEN }}

      - name: Install pinned Ansible collections
        shell: bash
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run deployment
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          RUNTIME_ENV_CONTENT: ${{ secrets.RUNTIME_ENV_CONTENT }}
        run: |
          cd ansible
          export ANSIBLE_PRIVATE_KEY_FILE="$HOME/.ssh/id_ed25519"
          ansible-playbook \
            -i "${{ inputs.inventory-path }}" \
            "${{ inputs.playbook }}" \
            --private-key "$ANSIBLE_PRIVATE_KEY_FILE"
