name: Protected Ansible Deploy

on:
  workflow_call:
    inputs:
      deployment-environment:
        required: true
        type: string
      runner-label:
        description: Dedicated client/internal deployment runner label; never an application host.
        required: true
        type: string
      ansible-repository:
        required: false
        default: ute-workspace/ansible
        type: string
      ansible-ref:
        required: false
        default: v1
        type: string
      playbook:
        required: true
        type: string
      inventory-path:
        description: Path available on the self-hosted runner, outside this repository.
        required: true
        type: string
    secrets:
      ANSIBLE_PRIVATE_KEY:
        required: true
      GHCR_USERNAME:
        required: false
      GHCR_TOKEN:
        required: false
      RUNTIME_ENV_CONTENT:
        required: false
      ANSIBLE_REPOSITORY_TOKEN:
        required: true

jobs:
  deploy:
    environment: ${{ inputs.deployment-environment }}
    runs-on: ${{ inputs.runner-label }}
    permissions:
      contents: read
    steps:
      - name: Checkout caller project for copied standards check
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          path: caller-project
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.agent-standards.yml
            /.agents/core
            /.agents/skills
            /.claude/skills

      - name: Check for copied agent standards
        continue-on-error: true
        shell: bash
        env:
          COPIED_STANDARDS_ROOT: caller-project
        run: |
          root="${COPIED_STANDARDS_ROOT:-.}"
          clean_url="https://github.com/ute-workspace/agent-standards/blob/main/scripts/clean-project.py"
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          escape() { local s="${1//%/%25}"; s="${s//$'\r'/%0D}"; printf '%s' "${s//$'\n'/%0A}"; }
          if [ ! -d "$root" ]; then
            echo "::warning title=Copied agent standards::Project checkout '$(escape "$root")' not found; copied agent standards were not checked."
            printf '## Copied agent standards\n\nNot checked: project checkout `%s` not found.\n' "$root" >> "$summary"
            exit 0
          fi
          found=()
          for path in .agents/core .agent-standards.yml; do
            if [ -e "$root/$path" ] || [ -L "$root/$path" ]; then found+=("$path"); fi
          done
          for dir in .claude/skills .agents/skills; do
            [ -d "$root/$dir" ] || continue
            while IFS= read -r -d '' entry; do
              found+=("$dir/${entry##*/}")
            done < <(find "$root/$dir" -mindepth 1 -maxdepth 1 -print0 | sort -z)
          done
          if [ "${#found[@]}" -eq 0 ]; then
            echo "No copied agent standards found."
            printf '## Copied agent standards\n\nNone found.\n' >> "$summary"
            exit 0
          fi
          {
            printf '## Copied agent standards\n\n'
            printf 'Warning only; the build is not failed. Remove these paths with [scripts/clean-project.py](%s):\n\n' "$clean_url"
          } >> "$summary"
          for path in "${found[@]}"; do
            echo "::warning title=Copied agent standards::$(escape "$path") is a copy of agent standards; remove it with $clean_url"
            printf -- '- `%s`\n' "$path" >> "$summary"
          done

      - name: Install protected SSH key
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.ANSIBLE_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Checkout approved Ansible release
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.ansible-repository }}
          ref: ${{ inputs.ansible-ref }}
          path: ansible
          token: ${{ secrets.ANSIBLE_REPOSITORY_TOKEN }}

      - name: Install pinned Ansible collections
        shell: bash
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run deployment
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          RUNTIME_ENV_CONTENT: ${{ secrets.RUNTIME_ENV_CONTENT }}
        run: |
          cd ansible
          export ANSIBLE_PRIVATE_KEY_FILE="$HOME/.ssh/id_ed25519"
          ansible-playbook \
            -i "${{ inputs.inventory-path }}" \
            "${{ inputs.playbook }}" \
            --private-key "$ANSIBLE_PRIVATE_KEY_FILE"
