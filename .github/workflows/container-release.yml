name: Container Release

on:
  workflow_call:
    inputs:
      image-name:
        description: ghcr.io namespace/name, without tag
        required: true
        type: string
      dockerfile:
        required: false
        default: Dockerfile
        type: string
      context:
        required: false
        default: .
        type: string
      trivyignores:
        description: >-
          Comma-separated relative path(s) to a .trivyignore file for
          this image. Trivy's own default (look in the runner's working
          directory, i.e. the repo root) will NOT find an ignore file
          that lives next to a Dockerfile in a subdirectory -- pass this
          explicitly when the image's Dockerfile isn't at the repo root.
        required: false
        default: ""
        type: string
    outputs:
      image-ref:
        description: Immutable image reference, including digest.
        value: ${{ jobs.release.outputs.image-ref }}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image-ref: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ inputs.image-name }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: ${{ inputs.trivyignores }}
      # steps.build.outputs.digest (above) is NOT the digest of what
      # actually lands in the registry: the build step above uses
      # `push: false, load: true` (loads into the local Docker daemon
      # only, for the Trivy scan step to read), and this "Push image"
      # step re-uploads that locally-loaded image via a plain `docker
      # push` afterward -- a separate operation that can (and, found for
      # real 2026-08-15, first real ghcr.io/ute-workspace/
      # semaphore-openssl consumer: does) produce a different manifest
      # digest than buildx's own build-time digest. Using the wrong one
      # here silently produced an image-ref no puller could ever
      # resolve ("descriptor is neither a manifest or index" /
      # "unexpected media type application/octet-stream" -- it pointed
      # at the image's config blob, not its manifest). Capture the real,
      # actually-pushed digest from `docker push`'s own output instead.
      - name: Push image
        id: push
        run: |
          docker push --all-tags "ghcr.io/${{ inputs.image-name }}" | tee /tmp/docker-push-output.txt
          digest="$(grep -oE 'sha256:[0-9a-f]{64}' /tmp/docker-push-output.txt | head -1)"
          if [ -z "$digest" ]; then
            echo "::error::could not parse a digest from docker push's own output" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - id: image
        shell: bash
        run: |
          echo "ref=ghcr.io/${{ inputs.image-name }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"
      # Best-effort: build provenance attestations require a feature this
      # org's current billing plan doesn't have for private repos
      # ("Feature not available for the ute-workspace organization" --
      # found for real on jenkins's (then ute-jenkins) first-ever
      # release). The image
      # push above already succeeded by this point; don't fail the whole
      # release over an attestation that can't be created yet.
      - uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-name: ghcr.io/${{ inputs.image-name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
