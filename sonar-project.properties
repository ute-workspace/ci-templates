# Read by jenkins-library's sonarQubeScan; Jenkins sets the project key (ci-templates) and the branch or pull request.
# The tests are Python unittest cases that run the workflows' shell steps; the shipped code is YAML and shell,
# which Python coverage does not measure, so no coverage report is sent.
sonar.sources=.
sonar.exclusions=tests/**
sonar.tests=tests
sonar.python.version=3.13
