name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  release:
    uses: ute-workspace/ci-templates/.github/workflows/node-container-release.yml@v1
    with:
      image-name: YOUR_ORG/YOUR_SERVICE
      working-directory: src
      # From v3: a private repository on a GitHub plan without
      # attestations sets `attest: skip` (default `required` fails the job).
      # attest: skip
