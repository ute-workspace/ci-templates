name: Promote Immutable Image to Client GitOps

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: Immutable container image reference including @sha256 digest
        required: true
        type: string

jobs:
  promote:
    uses: ute-workspace/ci-templates/.github/workflows/gitops-image-promotion.yml@v1
    with:
      deployment-environment: client-production
      gitops-repository: CLIENT_ORG/client-gitops
      gitops-ref: main
      kustomization-path: apps/client-service/overlays/production
      image-name: ghcr.io/CLIENT_ORG/client-service
      image-ref: ${{ inputs.image_ref }}
    secrets:
      GITOPS_REPOSITORY_TOKEN: ${{ secrets.CLIENT_GITOPS_WRITE_TOKEN }}
